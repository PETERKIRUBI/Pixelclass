<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
</head>
<body>
    <title>Multiple CSS Keyframes</title>  
    <style>  
        .box {  
            width: 100px;  
            height: 100px;  
            position: relative;  
            background-color: lightblue;  
            animation: multipleSteps 5s infinite;  
        }  
  
        @keyframes multipleSteps {  
            0% {  
                left: 0;  
                top: 0;  
                background-color: lightblue;  
            }  
  
            25% {  
                left: 200px;  
                top: 0;  
                background-color: lightgreen;  
            }  
  
            50% {  
                left: 200px;  
                top: 150px;  
                background-color: yellow;  
            }  
  
            75% {  
                left: 0;  
                top: 150px;  
                background-color: orange;  
            }  
  
            100% {  
                left: 0;  
                top: 0;  
                background-color: lightblue;  
            }  
        }  
    </style>  
</head>  
<body>  
  
    <h2>Multiple Keyframes Example</h2>  
  
    <div class="box"></div>  
  
</body>  
</html> 
</body>
</html>
